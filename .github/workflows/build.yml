name: Build Matisse3G Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: pmos-matisse3g-fixes
          submodules: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev make cpio python3 wget libgmp10 libmpc3
          echo "=== Install libmpfr4 for GCC 4.9 compatibility ==="
          wget -q http://archive.ubuntu.com/ubuntu/pool/main/m/mpfr4/libmpfr4_3.1.4-1_amd64.deb -O /tmp/libmpfr4.deb
          sudo dpkg -i /tmp/libmpfr4.deb
          echo "libmpfr4 installed:"
          ls -la /usr/lib/x86_64-linux-gnu/libmpfr.so.4*
          echo "=== Verify GCC 4.9.4 can run ==="
          TOOLCHAIN_DIR="$(pwd)/gcc-4.9.4-nolibc/arm-linux-gnueabi/bin"
          "$TOOLCHAIN_DIR"/arm-linux-gnueabi-gcc --version | head -1

      - name: Install GCC 4.9.4 cross-compiler (kernel.org)
        run: |
          echo "=== Downloading GCC 4.9.4 from kernel.org crosstool ==="
          wget -q https://cdn.kernel.org/pub/tools/crosstool/files/bin/x86_64/4.9.4/x86_64-gcc-4.9.4-nolibc-arm-linux-gnueabi.tar.xz
          tar -xf x86_64-gcc-4.9.4-nolibc-arm-linux-gnueabi.tar.xz
          TOOLCHAIN_DIR="$(pwd)/gcc-4.9.4-nolibc/arm-linux-gnueabi/bin"
          echo "Toolchain binaries:"
          ls "$TOOLCHAIN_DIR"/ | head -10
          echo ""
          echo "=== Creating gnueabihf symlinks for Samsung kernel compatibility ==="
          for f in "$TOOLCHAIN_DIR"/arm-linux-gnueabi-*; do
            hf_name="${f/arm-linux-gnueabi-/arm-linux-gnueabihf-}"
            ln -sf "$(basename "$f")" "$hf_name"
          done
          echo "Symlinks created:"
          ls "$TOOLCHAIN_DIR"/arm-linux-gnueabihf-* | head -5
          echo ""
          echo "$TOOLCHAIN_DIR" >> $GITHUB_PATH
          echo "=== Verifying ==="
          arm-linux-gnueabihf-gcc --version | head -1

      - name: Patch Samsung source bugs (GCC 4.9 compatible)
        run: |
          echo "=== 1. Fix exfat compat block: uid_eq etc already exist in kernel 3.4 ==="
          sed -i 's/#if LINUX_VERSION_CODE < KERNEL_VERSION(3,5,0)/#if 0 \/\* removed: functions already in 3.4 \*\//' \
            fs/exfat/exfat_super.c

          echo "=== 2. Fix f_mtp_samsung.c: .descriptors -> .fs_descriptors ==="
          sed -i 's/\.descriptors = /\.fs_descriptors = /g' drivers/usb/gadget/f_mtp_samsung.c

          echo "=== 3. Fix msm8226.c: angle bracket include -> quote include ==="
          sed -i 's|#include <qdsp6v2/msm-pcm-routing-v2.h>|#include "qdsp6v2/msm-pcm-routing-v2.h"|' \
            sound/soc/msm/msm8226.c

          echo "=== 4. Fix multiple definition of restart_reason ==="
          echo "  restart_reason defined in both restart.c:70 and sec_debug.c:735"
          echo "  Make restart.c use extern (sec_debug.c is the real definition)"
          sed -i 's/^void \*restart_reason;/extern void *restart_reason;/' \
            arch/arm/mach-msm/restart.c

          echo ""
          echo "Patches applied (Samsung source bugs + duplicate symbol fix)"

      - name: Fix defconfig
        run: |
          echo "=== Disable RT_GROUP_SCHED (BT fix) ==="
          sed -i 's/^CONFIG_RT_GROUP_SCHED=y/# CONFIG_RT_GROUP_SCHED is not set/' \
            arch/arm/configs/msm8226-sec_defconfig
          echo "=== Disable RADIO_IRIS (radio_hci_smd_init undefined - transport is module, radio-iris is built-in) ==="
          sed -i 's/^CONFIG_RADIO_IRIS=y/# CONFIG_RADIO_IRIS is not set/' \
            arch/arm/configs/msm8226-sec_defconfig
          echo "=== Enable PSTORE for crash log capture ==="
          echo "CONFIG_PSTORE=y" >> arch/arm/configs/msm8226-sec_defconfig
          echo "CONFIG_PSTORE_CONSOLE=y" >> arch/arm/configs/msm8226-sec_defconfig
          echo "CONFIG_PSTORE_PMSG=y" >> arch/arm/configs/msm8226-sec_defconfig
          echo "CONFIG_PSTORE_RAM=y" >> arch/arm/configs/msm8226-sec_defconfig
          echo "=== Change PANIC_TIMEOUT from 5 to -1 (hang forever on panic) ==="
          sed -i 's/^CONFIG_PANIC_TIMEOUT=5/CONFIG_PANIC_TIMEOUT=-1/' \
            arch/arm/configs/msm8226-sec_defconfig
          echo "Verify:"
          grep -n 'RT_GROUP_SCHED\|RADIO_IRIS\|PSTORE\|PANIC_TIMEOUT' arch/arm/configs/msm8226-sec_defconfig

      - name: Configure kernel
        run: |
          export ARCH=arm
          export CROSS_COMPILE=arm-linux-gnueabihf-
          make msm8226-sec_defconfig \
            VARIANT_DEFCONFIG=msm8228-sec_atlantic3geur_defconfig \
            SELINUX_DEFCONFIG=selinux_defconfig
          echo ""
          echo "=== RT_GROUP_SCHED ==="
          grep 'RT_GROUP_SCHED' .config || echo "not set (good!)"
          echo "=== CONFIG_OF ==="
          grep '^CONFIG_OF=' .config || echo "WARNING: not set"
          echo "=== RADIO_IRIS ==="
          grep 'RADIO_IRIS' .config || echo "not set (good!)"
          echo "=== PSTORE ==="
          grep 'PSTORE' .config || echo "not set"
          echo "=== PANIC_TIMEOUT ==="
          grep 'PANIC_TIMEOUT' .config || echo "not set"

      - name: Build kernel
        run: |
          export ARCH=arm
          export CROSS_COMPILE=arm-linux-gnueabihf-
          make -j$(nproc) CONFIG_NO_ERROR_ON_MISMATCH=y 2>&1 | tee /tmp/build.log
          BUILDRC=${PIPESTATUS[0]}
          echo "Build exit code: $BUILDRC"
          if [ "$BUILDRC" -ne 0 ]; then
            echo "=== ERRORS ==="
            grep -iE ': error:|fatal error|multiple definition|undefined reference' /tmp/build.log | grep -v '.gitignore' | tail -30
            exit 1
          fi

      - name: Verify kernel image
        run: |
          if [ -f arch/arm/boot/zImage ]; then
            echo "Found zImage: $(wc -c < arch/arm/boot/zImage) bytes"
          elif [ -f arch/arm/boot/Image ]; then
            echo "Found Image: $(wc -c < arch/arm/boot/Image) bytes"
          else
            echo "ERROR: No kernel image found!"
            ls -la arch/arm/boot/
            exit 1
          fi

      - name: Create boot.img (template-based)
        run: |
          python3 << 'PYEOF2'
          import struct, os

          # Get kernel from CI build
          if os.path.exists('arch/arm/boot/zImage'):
              kernel_path = 'arch/arm/boot/zImage'
          else:
              kernel_path = 'arch/arm/boot/Image'

          with open(kernel_path, 'rb') as f:
              new_kernel = f.read()
          print(f'New kernel: {len(new_kernel)} bytes')

          # Load original boot.img as template (preserves QCDT + SEANDROIDENFORCE + ramdisk)
          with open('boot/original-boot.img', 'rb') as f:
              orig = bytearray(f.read())
          print(f'Original boot.img: {len(orig)} bytes')

          page_size = struct.unpack('<I', orig[36:40])[0]  # 2048
          orig_kernel_size = struct.unpack('<I', orig[8:12])[0]
          orig_ramdisk_size = struct.unpack('<I', orig[16:20])[0]

          # Calculate original layout
          orig_kernel_pages = (orig_kernel_size + page_size - 1) // page_size
          orig_ramdisk_pages = (orig_ramdisk_size + page_size - 1) // page_size
          orig_ramdisk_offset = page_size + orig_kernel_pages * page_size
          orig_qcdt_offset = orig_ramdisk_offset + orig_ramdisk_pages * page_size

          # Extract ramdisk and QCDT+tail from original
          ramdisk_data = orig[orig_ramdisk_offset:orig_ramdisk_offset + orig_ramdisk_size]
          qcdt_data = orig[orig_qcdt_offset:]
          print(f'Original: kernel={orig_kernel_size} ({orig_kernel_pages} pages), ramdisk={orig_ramdisk_size} ({orig_ramdisk_pages} pages), QCDT+tail={len(qcdt_data)}')

          # Build new layout
          new_kernel_pages = (len(new_kernel) + page_size - 1) // page_size
          new_ramdisk_offset = page_size + new_kernel_pages * page_size
          new_qcdt_offset = new_ramdisk_offset + orig_ramdisk_pages * page_size
          new_total = new_qcdt_offset + len(qcdt_data)
          print(f'New: kernel={len(new_kernel)} ({new_kernel_pages} pages), ramdisk at {new_ramdisk_offset}, QCDT at {new_qcdt_offset}, total={new_total}')

          # Build new boot.img
          new_boot = bytearray(new_total)

          # Header: copy from original, update kernel size and cmdline
          header = bytearray(orig[:page_size])
          struct.pack_into('<I', header, 8, len(new_kernel))

          cmdline = b'androidboot.hardware=qcom user_debug=23 msm_rtb.filter=0x37 zcache.enabled=1 zcache.compressor=lz4 buildvariant=userdebug androidboot.selinux=permissive androidboot.init_fatal_panic=true panic=60 loglevel=8 ignore_loglevel pstore.ramoops.mem_address=0x3F000000 pstore.ramoops.mem_size=0x100000 pstore.record_size=0x20000 pstore.console_size=0x40000'
          cmdline = cmdline + b'\x00' * (512 - len(cmdline))
          header[64:64+512] = cmdline

          new_boot[:page_size] = header

          # New kernel (padded)
          padded_kernel = new_kernel + b'\x00' * (new_kernel_pages * page_size - len(new_kernel))
          new_boot[page_size:page_size + len(padded_kernel)] = padded_kernel

          # Ramdisk (at new offset, same content)
          padded_ramdisk = ramdisk_data + b'\x00' * (orig_ramdisk_pages * page_size - len(ramdisk_data))
          new_boot[new_ramdisk_offset:new_ramdisk_offset + len(padded_ramdisk)] = padded_ramdisk

          # QCDT+tail (SEANDROIDENFORCE etc)
          new_boot[new_qcdt_offset:new_qcdt_offset + len(qcdt_data)] = qcdt_data

          # Verify
          assert new_boot[:8] == b'ANDROID!', 'Bad magic!'
          assert new_boot[new_qcdt_offset:new_qcdt_offset+4] == b'QCDT', 'Bad QCDT!'
          assert new_boot[-16:] == b'SEANDROIDENFORCE', 'No SEANDROIDENFORCE!'

          with open('boot.img', 'wb') as f:
              f.write(new_boot)

          print(f'boot.img: {len(new_boot)} bytes')
          print('Verification: ANDROID magic OK, QCDT OK, SEANDROIDENFORCE OK')
          PYEOF2

          ls -la boot.img

      - name: Upload boot.img
        uses: actions/upload-artifact@v4
        with:
          name: matisse3g-boot-${{ github.sha }}
          path: boot.img
          retention-days: 30

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: matisse3g-kernel-${{ github.sha }}
          path: arch/arm/boot/
          retention-days: 30

      - name: Build summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Toolchain**: GCC 4.9.4 (kernel.org crosstool, matching original Samsung kernel compiler era)" >> $GITHUB_STEP_SUMMARY
          echo "- **Kernel**: matisse3g (ARM32, Snapdragon 400)" >> $GITHUB_STEP_SUMMARY
          echo "- **CONFIG_RT_GROUP_SCHED**: DISABLED (BT fix!)" >> $GITHUB_STEP_SUMMARY
          echo "- **CONFIG_PSTORE**: ENABLED (crash log capture!)" >> $GITHUB_STEP_SUMMARY
          echo "- **CONFIG_PANIC_TIMEOUT**: -1 (hang on panic, no watchdog reset)" >> $GITHUB_STEP_SUMMARY
          echo "- **cmdline**: init_fatal_panic=true, panic=60, pstore.ramoops, permissive" >> $GITHUB_STEP_SUMMARY
          echo "- **Patches**: 3 source bug fixes only (exfat compat, f_mtp_samsung, msm8226 include) - NO GCC 11 workarounds needed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Flash" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "adb push boot.img /sdcard/" >> $GITHUB_STEP_SUMMARY
          echo "adb shell su -c dd if=/sdcard/boot.img of=/dev/block/platform/msm_sdcc.1/by-name/boot" >> $GITHUB_STEP_SUMMARY
          echo "adb reboot" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
