name: Build Matisse3G Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: pmos-matisse3g-fixes
          submodules: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf bc bison flex libssl-dev make cpio python3

      - name: Patch kernel for modern GCC
        run: |
          echo "=== 1. Remove -Werror-implicit-function-declaration ==="
          sed -i 's/-Werror-implicit-function-declaration/-Wno-implicit-function-declaration/g' Makefile
          sed -i 's/-Werror=implicit-function-declaration/-Wno-implicit-function-declaration/g' Makefile

          echo "=== 2. Change -fno-common to -fcommon (fixes multiple definition errors, GCC 10+ default) ==="
          sed -i 's/-fno-common/-fcommon/g' Makefile

          echo "=== 3. Fix put_user() register const asm() bug (GCC 8+, gcc bugzilla 85745) ==="
          sed -i 's/register const typeof(\*(p)) __r2 asm("r2") = (x);/register typeof(*(p)) __r2 asm("r2") = (x);/' \
            arch/arm/include/asm/uaccess.h

          echo "=== 4. Fix exfat compat block: uid_eq etc already exist in kernel 3.4 ==="
          sed -i 's/#if LINUX_VERSION_CODE < KERNEL_VERSION(3,5,0)/#if 0 \/\* removed: functions already in 3.4 \*\//' \
            fs/exfat/exfat_super.c

          echo "=== 5. Fix f_mtp_samsung.c: .descriptors -> .fs_descriptors ==="
          sed -i 's/\.descriptors = /\.fs_descriptors = /g' drivers/usb/gadget/f_mtp_samsung.c

          echo ""
          echo "Verification:"
          grep -n 'fcommon' Makefile | head -3
          grep -n 'register.*typeof.*__r2' arch/arm/include/asm/uaccess.h
          grep -n 'LINUX_VERSION.*exfat\|#if 0.*removed' fs/exfat/exfat_super.c

      - name: Disable CONFIG_RT_GROUP_SCHED in defconfig
        run: |
          echo "Before:"
          grep -n 'RT_GROUP_SCHED' arch/arm/configs/msm8226-sec_defconfig
          sed -i 's/^CONFIG_RT_GROUP_SCHED=y/# CONFIG_RT_GROUP_SCHED is not set/' \
            arch/arm/configs/msm8226-sec_defconfig
          echo "After:"
          grep -n 'RT_GROUP_SCHED' arch/arm/configs/msm8226-sec_defconfig

      - name: Configure kernel
        run: |
          export ARCH=arm
          export CROSS_COMPILE=arm-linux-gnueabihf-
          make msm8226-sec_defconfig \
            VARIANT_DEFCONFIG=msm8228-sec_atlantic3geur_defconfig \
            SELINUX_DEFCONFIG=selinux_defconfig
          echo ""
          echo "=== RT_GROUP_SCHED ==="
          grep 'RT_GROUP_SCHED' .config || echo "not set (good!)"
          echo "=== CONFIG_OF ==="
          grep '^CONFIG_OF=' .config || echo "WARNING: not set"

      - name: Build kernel
        run: |
          export ARCH=arm
          export CROSS_COMPILE=arm-linux-gnueabihf-
          make -j$(nproc) 2>&1 | tee /tmp/build.log
          BUILDRC=${PIPESTATUS[0]}
          echo "Build exit code: $BUILDRC"
          if [ "$BUILDRC" -ne 0 ]; then
            echo "=== ERRORS ==="
            grep -iE ': error:|fatal error|multiple definition' /tmp/build.log | grep -v '.gitignore' | tail -30
            exit 1
          fi

      - name: Verify kernel image
        run: |
          if [ -f arch/arm/boot/zImage ]; then
            echo "Found zImage: $(wc -c < arch/arm/boot/zImage) bytes"
          elif [ -f arch/arm/boot/Image ]; then
            echo "Found Image: $(wc -c < arch/arm/boot/Image) bytes"
          else
            echo "ERROR: No kernel image found!"
            ls -la arch/arm/boot/
            exit 1
          fi

      - name: Create boot.img
        run: |
          python3 << 'PYEOF2'
          import struct, os, urllib.request, base64, json

          if os.path.exists('arch/arm/boot/zImage'):
              kernel_path = 'arch/arm/boot/zImage'
          else:
              kernel_path = 'arch/arm/boot/Image'

          with open(kernel_path, 'rb') as f:
              kernel = f.read()
          print(f'Kernel: {len(kernel)} bytes')

          token = os.environ['GH_TOKEN']
          repo_url = os.environ.get('GITHUB_REPOSITORY', 'criollojoel10/android_kernel_samsung_msm8226')
          url = f'https://api.github.com/repos/{repo_url}/contents/boot/ramdisk.gz'
          req = urllib.request.Request(url, headers={'Authorization': f'token {token}'})
          resp = urllib.request.urlopen(req)
          data = json.loads(resp.read())
          ramdisk = base64.b64decode(data['content'])
          print(f'Ramdisk: {len(ramdisk)} bytes')

          page_size = 2048
          base_addr = 0x00000000
          kernel_offset = 0x00008000
          ramdisk_offset = 0x02000000
          tags_offset = 0x01e00000
          cmdline = b'androidboot.hardware=qcom user_debug=23 msm_rtb.filter=0x37 zcache.enabled=1 zcache.compressor=lz4 buildvariant=userdebug'

          def pad(value):
              return (value + page_size - 1) & ~(page_size - 1)

          kernel_padded = pad(len(kernel))
          ramdisk_padded = pad(len(ramdisk))

          header = bytearray(page_size)
          header[0:8] = b'ANDROID!'
          struct.pack_into('<I', header, 8, len(kernel))
          struct.pack_into('<I', header, 12, base_addr + kernel_offset)
          struct.pack_into('<I', header, 16, len(ramdisk))
          struct.pack_into('<I', header, 20, base_addr + ramdisk_offset)
          struct.pack_into('<I', header, 24, 0)
          struct.pack_into('<I', header, 28, 0)
          struct.pack_into('<I', header, 32, base_addr + tags_offset)
          struct.pack_into('<I', header, 36, page_size)
          struct.pack_into('<I', header, 40, 0)
          struct.pack_into('<I', header, 44, 0)
          header[48:64] = b'SM-T531\x00'
          header[64:64+len(cmdline)] = cmdline

          with open('boot.img', 'wb') as out:
              out.write(header)
              out.write(kernel)
              out.write(b'\x00' * (kernel_padded - len(kernel)))
              out.write(ramdisk)
              out.write(b'\x00' * (ramdisk_padded - len(ramdisk)))

          total = page_size + kernel_padded + ramdisk_padded
          print(f'boot.img: {total} bytes ({total // 1024} KB)')
          PYEOF2

          ls -la boot.img

      - name: Upload boot.img
        uses: actions/upload-artifact@v4
        with:
          name: matisse3g-boot-${{ github.sha }}
          path: boot.img
          retention-days: 30

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: matisse3g-kernel-${{ github.sha }}
          path: arch/arm/boot/
          retention-days: 30

      - name: Build summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Kernel**: matisse3g (ARM32, Snapdragon 400)" >> $GITHUB_STEP_SUMMARY
          echo "- **CONFIG_RT_GROUP_SCHED**: DISABLED (BT fix!)" >> $GITHUB_STEP_SUMMARY
          echo "- **GCC fixes**: -fcommon, put_user const, exfat compat, -Wno-implicit-function-declaration" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Flash" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "adb push boot.img /sdcard/" >> $GITHUB_STEP_SUMMARY
          echo "adb shell su -c dd if=/sdcard/boot.img of=/dev/block/platform/msm_sdcc.1/by-name/boot" >> $GITHUB_STEP_SUMMARY
          echo "adb reboot" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
