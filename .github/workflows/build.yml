name: Build Matisse3G Kernel

on:
  workflow_dispatch:
  push:
    branches: [pmos-matisse3g-fixes]
    paths:
      - 'arch/arm/**'
      - 'kernel/**'
      - 'drivers/**'
      - 'include/**'
      - 'Makefile'
      - 'arch/arm/configs/matisse3g_defconfig'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: pmos-matisse3g-fixes
          submodules: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf bc bison flex libssl-dev make cpio python3 git

      - name: Verify no CONFIG_RT_GROUP_SCHED
        run: |
          grep -i "RT_GROUP_SCHED" arch/arm/configs/matisse3g_defconfig && \
            echo "WARNING: RT_GROUP_SCHED found in defconfig!" || \
            echo "OK: RT_GROUP_SCHED not in defconfig"

      - name: Configure kernel
        run: |
          export ARCH=arm
          export CROSS_COMPILE=arm-linux-gnueabihf-
          make matisse3g_defconfig
          echo "--- .config RT settings ---"
          grep -i "RT_GROUP_SCHED\|RT_RUNTIME\|PREEMPT" .config || true

      - name: Build kernel
        run: |
          export ARCH=arm
          export CROSS_COMPILE=arm-linux-gnueabihf-
          make -j$(nproc) zImage Image 2>&1 | tail -50

      - name: Create boot.img
        run: |
          ls -la arch/arm/boot/Image

          python3 -c "
          import urllib.request, base64, json, os

          token = os.environ['GH_TOKEN']
          url = 'https://api.github.com/repos/${{ github.repository }}/contents/boot/ramdisk.gz'
          req = urllib.request.Request(url, headers={'Authorization': f'token {token}'})
          resp = urllib.request.urlopen(req)
          data = json.loads(resp.read())
          content = base64.b64decode(data['content'])
          with open('ramdisk.gz', 'wb') as f:
              f.write(content)
          print(f'Ramdisk: {len(content)} bytes')
          "

          python3 -c "
          import struct, os

          def align(value, page_size):
              return (value + page_size - 1) & ~(page_size - 1)

          page_size = 2048
          kernel_offset = 0x8000
          ramdisk_offset = 0x02000000
          tags_offset = 0x01e00000
          base = 0x00000000
          cmdline = b'androidboot.hardware=qcom user_debug=23 msm_rtb.filter=0x37 zcache.enabled=1 zcache.compressor=lz4 buildvariant=userdebug'

          with open('arch/arm/boot/Image', 'rb') as f:
              kernel = f.read()
          with open('ramdisk.gz', 'rb') as f:
              ramdisk = f.read()

          kernel_addr = base + kernel_offset
          ramdisk_addr = base + ramdisk_offset
          tags_addr = base + tags_offset

          kernel_size = len(kernel)
          ramdisk_size = len(ramdisk)

          kernel_pages = align(kernel_size, page_size)
          ramdisk_pages = align(ramdisk_size, page_size)

          header = bytearray(page_size)
          struct.pack_into('<I', header, 0, 0x414C4452)
          struct.pack_into('<I', header, 4, 1)
          struct.pack_into('<I', header, 8, kernel_size)
          struct.pack_into('<I', header, 12, kernel_addr)
          struct.pack_into('<I', header, 16, ramdisk_size)
          struct.pack_into('<I', header, 20, ramdisk_addr)
          struct.pack_into('<I', header, 24, 0)
          struct.pack_into('<I', header, 28, 0)
          struct.pack_into('<I', header, 32, tags_addr)
          struct.pack_into('<I', header, 36, page_size)
          struct.pack_into('<I', header, 40, 0)
          struct.pack_into('<I', header, 44, 0)
          header[48:64] = b'SM-T531\x00'
          header[64:64+len(cmdline)] = cmdline
          header[2048-64:2048] = b'ANDROID!'

          with open('boot.img', 'wb') as out:
              out.write(header)
              out.write(kernel)
              out.write(b'\x00' * (kernel_pages - kernel_size))
              out.write(ramdisk)
              out.write(b'\x00' * (ramdisk_pages - ramdisk_size))

          total = page_size + kernel_pages + ramdisk_pages
          print(f'boot.img created: {total} bytes')
          print(f'  kernel: {kernel_size} bytes ({kernel_pages} pages)')
          print(f'  ramdisk: {ramdisk_size} bytes ({ramdisk_pages} pages)')
          "

          ls -la boot.img

      - name: Upload boot.img artifact
        uses: actions/upload-artifact@v4
        with:
          name: matisse3g-boot-${{ github.sha }}
          path: boot.img
          retention-days: 30

      - name: Upload kernel Image artifact
        uses: actions/upload-artifact@v4
        with:
          name: matisse3g-kernel-${{ github.sha }}
          path: arch/arm/boot/Image
          retention-days: 30

      - name: Build summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Kernel**: \`arch/arm/boot/Image\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Boot.img**: \`boot.img\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Config**: \`matisse3g_defconfig\`" >> $GITHUB_STEP_SUMMARY
          echo "- **CONFIG_RT_GROUP_SCHED**: NOT SET (fixed!)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Flash instructions" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "fastboot flash boot boot.img" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "Or via adb:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "adb push boot.img /sdcard/" >> $GITHUB_STEP_SUMMARY
          echo "adb shell su -c 'dd if=/sdcard/boot.img of=/dev/block/platform/msm_sdcc.1/by-name/boot'" >> $GITHUB_STEP_SUMMARY
          echo "adb reboot" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
