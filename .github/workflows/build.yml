name: Build Matisse3G Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: pmos-matisse3g-fixes
          submodules: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf bc bison flex libssl-dev make cpio python3

      - name: Patch kernel for modern GCC
        run: |
          echo "=== 1. Remove -Werror-implicit-function-declaration ==="
          sed -i 's/-Werror-implicit-function-declaration/-Wno-implicit-function-declaration/g' Makefile
          sed -i 's/-Werror=implicit-function-declaration/-Wno-implicit-function-declaration/g' Makefile

          echo "=== 2. Change -fno-common to -fcommon (fixes multiple definition errors, GCC 10+ default) ==="
          sed -i 's/-fno-common/-fcommon/g' Makefile

          echo "=== 3. Fix put_user() register const asm() bug (GCC 8+, gcc bugzilla 85745) ==="
          sed -i 's/register const typeof(\*(p)) __r2 asm("r2") = (x);/register typeof(*(p)) __r2 asm("r2") = (x);/' \
            arch/arm/include/asm/uaccess.h

          echo "=== 4. Fix exfat compat block: uid_eq etc already exist in kernel 3.4 ==="
          sed -i 's/#if LINUX_VERSION_CODE < KERNEL_VERSION(3,5,0)/#if 0 \/\* removed: functions already in 3.4 \*\//' \
            fs/exfat/exfat_super.c

          echo "=== 5. Fix f_mtp_samsung.c: .descriptors -> .fs_descriptors ==="
          sed -i 's/\.descriptors = /\.fs_descriptors = /g' drivers/usb/gadget/f_mtp_samsung.c

          echo "=== 6. Fix msm8226.c: angle bracket include -> quote include ==="
          sed -i 's|#include <qdsp6v2/msm-pcm-routing-v2.h>|#include "qdsp6v2/msm-pcm-routing-v2.h"|'             sound/soc/msm/msm8226.c

          echo "=== 7. Fix C99 inline stubs in mouse headers (GCC 11 doesn't emit standalone inline copies) ==="
          for hdr in drivers/input/mouse/sentelic.h drivers/input/mouse/lifebook.h drivers/input/mouse/trackpoint.h drivers/input/mouse/alps.h drivers/input/mouse/logips2pp.h; do
            sed -i 's/^inline /static inline /g' "$hdr"
          done

          echo "=== 8. Fix nfqnl linker error: change guard + static inline stubs ==="
          sed -i 's/#if defined(CONFIG_NF_CONNTRACK) || defined(CONFIG_NF_CONNTRACK_MODULE)/#ifdef CONFIG_NETFILTER_NETLINK_QUEUE_CT/' include/net/netfilter/nfnetlink_queue.h
          sed -i 's/^inline /static inline /g' include/net/netfilter/nfnetlink_queue.h

          echo ""
          echo "Verification:"
          grep -n 'fcommon' Makefile | head -3
          grep -n 'register.*typeof.*__r2' arch/arm/include/asm/uaccess.h
          grep -n 'static inline' drivers/input/mouse/sentelic.h drivers/input/mouse/lifebook.h
          grep -n 'static inline\|CONFIG_NETFILTER_NETLINK_QUEUE_CT' include/net/netfilter/nfnetlink_queue.h

      - name: Fix defconfig
        run: |
          echo "=== Disable RT_GROUP_SCHED (BT fix) ==="
          sed -i 's/^CONFIG_RT_GROUP_SCHED=y/# CONFIG_RT_GROUP_SCHED is not set/' \
            arch/arm/configs/msm8226-sec_defconfig
          echo "=== Disable RADIO_IRIS (radio_hci_smd_init undefined - transport is module, radio-iris is built-in) ==="
          sed -i 's/^CONFIG_RADIO_IRIS=y/# CONFIG_RADIO_IRIS is not set/' \
            arch/arm/configs/msm8226-sec_defconfig
          echo "Verify:"
          grep -n 'RT_GROUP_SCHED\|RADIO_IRIS' arch/arm/configs/msm8226-sec_defconfig

      - name: Configure kernel
        run: |
          export ARCH=arm
          export CROSS_COMPILE=arm-linux-gnueabihf-
          make msm8226-sec_defconfig \
            VARIANT_DEFCONFIG=msm8228-sec_atlantic3geur_defconfig \
            SELINUX_DEFCONFIG=selinux_defconfig
          echo ""
          echo "=== RT_GROUP_SCHED ==="
          grep 'RT_GROUP_SCHED' .config || echo "not set (good!)"
          echo "=== CONFIG_OF ==="
          grep '^CONFIG_OF=' .config || echo "WARNING: not set"
          echo "=== RADIO_IRIS ==="
          grep 'RADIO_IRIS' .config || echo "not set (good!)"
          echo "=== NF_CONNTRACK ==="
          grep 'NF_CONNTRACK=' .config || echo "not set"
          echo "=== NETFILTER_NETLINK_QUEUE_CT ==="
          grep 'NETFILTER_NETLINK_QUEUE_CT' .config || echo "not set"

      - name: Build kernel
        run: |
          export ARCH=arm
          export CROSS_COMPILE=arm-linux-gnueabihf-
          make -j$(nproc) CONFIG_NO_ERROR_ON_MISMATCH=y 2>&1 | tee /tmp/build.log
          BUILDRC=${PIPESTATUS[0]}
          echo "Build exit code: $BUILDRC"
          if [ "$BUILDRC" -ne 0 ]; then
            echo "=== ERRORS ==="
            grep -iE ': error:|fatal error|multiple definition|undefined reference' /tmp/build.log | grep -v '.gitignore' | tail -30
            exit 1
          fi

      - name: Verify kernel image
        run: |
          if [ -f arch/arm/boot/zImage ]; then
            echo "Found zImage: $(wc -c < arch/arm/boot/zImage) bytes"
          elif [ -f arch/arm/boot/Image ]; then
            echo "Found Image: $(wc -c < arch/arm/boot/Image) bytes"
          else
            echo "ERROR: No kernel image found!"
            ls -la arch/arm/boot/
            exit 1
          fi

      - name: Create boot.img (template-based)
        run: |
          python3 << 'PYEOF2'
          import struct, math, os

          TEMPLATE = 'boot/original-boot.img'

          with open(TEMPLATE, 'rb') as f:
              orig = f.read()

          if os.path.exists('arch/arm/boot/zImage'):
              kernel_path = 'arch/arm/boot/zImage'
          else:
              kernel_path = 'arch/arm/boot/Image'

          with open(kernel_path, 'rb') as f:
              new_kernel = f.read()

          page = 2048
          kernel_size_orig = struct.unpack('<I', orig[8:12])[0]
          ramdisk_size_orig = struct.unpack('<I', orig[16:20])[0]
          ramdisk_padded = math.ceil(ramdisk_size_orig / page) * page
          new_kernel_padded = math.ceil(len(new_kernel) / page) * page

          orig_ramdisk_start = page + math.ceil(kernel_size_orig / page) * page
          orig_qcdt_start = orig_ramdisk_start + ramdisk_padded

          ramdisk_data = orig[orig_ramdisk_start:orig_ramdisk_start + ramdisk_size_orig]
          qcdt_and_rest = orig[orig_qcdt_start:]

          new_boot = bytearray()
          header = bytearray(orig[:page])
          header[8:12] = struct.pack('<I', len(new_kernel))
          new_boot += header
          new_boot += new_kernel + b'\x00' * (new_kernel_padded - len(new_kernel))
          new_boot += ramdisk_data + b'\x00' * (ramdisk_padded - len(ramdisk_data))
          new_boot += qcdt_and_rest

          with open('boot.img', 'wb') as f:
              f.write(new_boot)

          print(f'New kernel: {len(new_kernel)} bytes')
          print(f'Original ramdisk: {ramdisk_size_orig} bytes')
          print(f'QCDT+tail: {len(qcdt_and_rest)} bytes')
          print(f'boot.img: {len(new_boot)} bytes ({len(new_boot) // 1024} KB)')
          print(f'QCDT magic: {bytes(new_boot[page + new_kernel_padded + ramdisk_padded:page + new_kernel_padded + ramdisk_padded + 4])}')
          print(f'Last 16: {bytes(new_boot[-16:])}')
          PYEOF2

          ls -la boot.img

      - name: Upload boot.img
        uses: actions/upload-artifact@v4
        with:
          name: matisse3g-boot-${{ github.sha }}
          path: boot.img
          retention-days: 30

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: matisse3g-kernel-${{ github.sha }}
          path: arch/arm/boot/
          retention-days: 30

      - name: Build summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Kernel**: matisse3g (ARM32, Snapdragon 400)" >> $GITHUB_STEP_SUMMARY
          echo "- **CONFIG_RT_GROUP_SCHED**: DISABLED (BT fix!)" >> $GITHUB_STEP_SUMMARY
          echo "- **CONFIG_RADIO_IRIS**: DISABLED (radio_hci_smd undefined)" >> $GITHUB_STEP_SUMMARY
          echo "- **GCC fixes**: -fcommon, put_user const, exfat compat, -Wno-implicit-function-declaration, C99 inline→static inline (5 mouse headers + nfnetlink_queue.h), nfnetlink_queue CT guard fix" >> $GITHUB_STEP_SUMMARY
          echo "- **boot.img**: Template-based (preserves Samsung QCDT + SEANDROIDENFORCE)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Flash (Heimdall - no root needed)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "# Download boot.img from Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "# Boot tablet into Download mode (Vol Down + Power)" >> $GITHUB_STEP_SUMMARY
          echo "heimdall flash --BOOT boot.img --no-reboot" >> $GITHUB_STEP_SUMMARY
          echo "# Then reboot from Download mode" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Re-root with Magisk" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "# After confirmed boot, patch stock boot.img with Magisk app" >> $GITHUB_STEP_SUMMARY
          echo "# Then flash Magisk-patched boot via Heimdall" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

